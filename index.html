<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DCheck — Цифровой профиль</title>
    <link rel="icon" type="image/png" href="img/favicon.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ===== ШАПКА ===== -->
    <header class="header">
        <div class="logo">D<span>Check</span></div>
       
    </header>

    <!-- ===== МЕНЮ (ГОРИЗОНТАЛЬНОЕ) ===== -->
    <nav class="menu" id="menu">
        <button class="menu-btn active" data-page="home"> Главная</button>
        <button class="menu-btn" data-page="tools"> Инструменты</button>
        <button class="menu-btn" data-page="blog"> Блог</button>
        <button class="menu-btn" data-page="about"> Об авторе</button>
        <button class="menu-btn" data-page="contacts"> Контакты</button>
    </nav>

    <!-- ===== ОСНОВНОЙ КОНТЕЙНЕР (РАСШИРЕННЫЙ) ===== -->
    <main class="container">
        <div class="content" id="content">
            <!-- Контент подставляется через JavaScript -->
        </div>
    </main>

    <!-- ===== ФУТЕР ===== -->
    <footer class="footer">
        <p>© Дмитрий Викторов, 2026 Все права защищены.</p>
    </footer>

    <script src="js/modules/accordion.js"></script>
    <script src="js/modules/theme.js"></script>
    <script src="js/modules/search.js"></script>
    <script src="js/modules/pageLoader.js"></script>
    <script src="js/modules/tools.js"></script>
    <script src="js/modules/blog.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
