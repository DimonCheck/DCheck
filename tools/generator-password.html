<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей — DCheck</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--bg-content);
            border-radius: 24px;
            border: 1px solid var(--border);
        }
        .tool-container h2 {
            margin-bottom: 0.5rem;
        }
        .tool-container .subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .tool-container label {
            display: block;
            margin: 0.8rem 0 0.3rem 0;
            font-weight: 500;
        }
        .tool-container input[type="text"] {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
        }
        .tool-container input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-generate {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: background 0.2s;
        }
        .btn-generate:hover {
            background: #1f5e4c;
        }
        .password-result {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: var(--bg-body);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            min-height: 60px;
        }
        .password-result span {
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            word-break: break-all;
            color: var(--text-primary);
        }
        .password-result .placeholder {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .btn-copy {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.3rem;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: rgba(43, 122, 98, 0.1);
        }
        .info-box {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: rgba(43, 122, 98, 0.06);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-left: 3px solid var(--accent);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .error-text {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 700px; margin: 2rem auto; padding: 0 1rem;">
        <a href="../index.html" class="back-link">← На главную</a>

        <div class="tool-container">
            <h2>🔐 Генератор паролей</h2>
            <p class="subtitle">Введите часть пароля — остальное сгенерирует программа.</p>

            <label for="userInput">Ваша часть пароля:</label>
            <input type="text" id="userInput" placeholder="Например: myPass" maxlength="8">
            <div id="inputError" class="error-text"></div>

            <button class="btn-generate" onclick="generatePassword()">🎲 Сгенерировать</button>

            <div class="password-result" id="result">
                <span id="passwordDisplay" class="placeholder">Нажмите «Сгенерировать»</span>
                <button class="btn-copy" onclick="copyPassword()" title="Скопировать" id="copyBtn" style="display: none;">📋</button>
            </div>

            <div class="info-box">
                ⚡ Пароль всегда состоит из <strong>8 символов</strong>.
                Если вы ввели больше — первые 8 символов будут использованы.
            </div>
        </div>
    </div>

    <script>
        // ===== ГЕНЕРАТОР ПАРОЛЕЙ =====
        // Точная копия логики из вашего C# кода

        function generatePassword() {
            const totalLength = 8;
            const digits = "0123456789";
            const letters = "ABCDIFGabcdifghyjklmnopqwsxzv";

            // 1. Получаем ввод пользователя
            let input = document.getElementById('userInput').value;
            const errorEl = document.getElementById('inputError');
            let userPart = '';

            // 2. Обрезаем до 8 символов (как в C#)
            if (input.length > 8) {
                userPart = input.substring(0, 8);
                errorEl.textContent = '⚠️ Введено больше 8 символов. Использованы первые 8.';
            } else {
                userPart = input;
                errorEl.textContent = '';
            }

            // 3. Сколько символов нужно сгенерировать
            let charsToGenerate = totalLength - userPart.length;

            // 4. Генерируем символы (точно как в C#)
            const rnd = {
                next: (min, max) => Math.floor(Math.random() * (max - min)) + min
            };
            let generatedPart = '';

            for (let i = 0; i < charsToGenerate; i++) {
                let choice = rnd.next(0, 2);
                if (choice === 0) {
                    let randomDigit = digits[rnd.next(0, digits.length)];
                    generatedPart += randomDigit;
                } else {
                    let randomLetter = letters[rnd.next(0, letters.length)];
                    generatedPart += randomLetter;
                }
            }

            // 5. Собираем финальный пароль
            const finalPassword = userPart + generatedPart;
            const passwordDisplay = document.getElementById('passwordDisplay');
            const copyBtn = document.getElementById('copyBtn');

            // 6. Отображаем результат
            passwordDisplay.textContent = finalPassword;
            passwordDisplay.className = '';
            copyBtn.style.display = 'inline-block';
        }

        // ===== КОПИРОВАНИЕ =====
        function copyPassword() {
            const text = document.getElementById('passwordDisplay').textContent;
            if (text && text !== 'Нажмите «Сгенерировать»') {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyBtn');
                    const originalText = btn.textContent;
                    btn.textContent = '✅';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 1500);
                }).catch(() => {
                    alert('Не удалось скопировать. Скопируйте вручную.');
                });
            }
        }

        // ===== ГЕНЕРАЦИЯ ПРИ ЗАГРУЗКЕ (если поле пустое) =====
        window.onload = function() {
            // Если хотите, чтобы при загрузке сразу генерировался пароль — раскомментируйте:
            // generatePassword();
        };
    </script>
</body>
</html>
