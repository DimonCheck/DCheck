<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор паролей — DCheck</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .tool-container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem;
            background: var(--bg-content);
            border-radius: 24px;
            border: 1px solid var(--border);
        }
        .tool-container h2 {
            margin-bottom: 0.5rem;
        }
        .tool-container .subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }
        .tool-container label {
            display: block;
            margin: 0.8rem 0 0.3rem 0;
            font-weight: 500;
        }
        .tool-container input[type="text"] {
            width: 100%;
            padding: 0.7rem 1rem;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--bg-body);
            color: var(--text-primary);
            font-size: 1rem;
        }
        .tool-container input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }
        .btn-generate {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 1.2rem;
            transition: background 0.2s;
        }
        .btn-generate:hover {
            background: #1f5e4c;
        }
        .password-result {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            background: var(--bg-body);
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border);
            min-height: 60px;
        }
        .password-result span {
            font-family: 'Courier New', monospace;
            font-size: 1.3rem;
            word-break: break-all;
            color: var(--text-primary);
        }
        .password-result .placeholder {
            color: var(--text-muted);
            font-size: 1rem;
        }
        .btn-copy {
            background: none;
            border: none;
            color: var(--accent);
            cursor: pointer;
            font-size: 1.3rem;
            padding: 0.3rem 0.6rem;
            border-radius: 8px;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: rgba(43, 122, 98, 0.1);
        }
        .info-box {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: rgba(43, 122, 98, 0.06);
            border-radius: 12px;
            font-size: 0.9rem;
            color: var(--text-muted);
            border-left: 3px solid var(--accent);
        }
        .back-link {
            display: inline-block;
            margin-bottom: 1.5rem;
            color: var(--accent);
            text-decoration: none;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .error-text {
            color: #e74c3c;
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }
        .badge {
            display: inline-block;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 0.1rem 0.6rem;
            border-radius: 12px;
            margin-left: 0.5rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div class="container" style="max-width: 700px; margin: 2rem auto; padding: 0 1rem;">
        <a href="../index.html" class="back-link">← На главную</a>

        <div class="tool-container">
            <h2>🔐 Генератор паролей <span class="badge">12 символов</span></h2>
            <p class="subtitle">Введите часть пароля — остальное сгенерирует программа.</p>

            <label for="userInput">Ваша часть пароля:</label>
            <input type="text" id="userInput" placeholder="Например: myPass" maxlength="12">
            <div id="inputError" class="error-text"></div>

            <button class="btn-generate" onclick="generatePassword()">🎲 Сгенерировать</button>

            <div class="password-result" id="result">
                <span id="passwordDisplay" class="placeholder">Нажмите «Сгенерировать»</span>
                <button class="btn-copy" onclick="copyPassword()" title="Скопировать" id="copyBtn" style="display: none;">📋</button>
            </div>

            <div class="info-box">
                ⚡ Пароль всегда состоит из <strong>12 символов</strong>.
                Если вы ввели больше — первые 12 символов будут использованы.
            </div>
        </div>
    </div>

    <script>
        // ===== ГЕНЕРАТОР ПАРОЛЕЙ (12 СИМВОЛОВ) =====
        const totalLength = 12;
        const digits = "0123456789";
        const letters = "ABCDIFGabcdifghyjklmnopqwsxzv";

        function generatePassword() {
            let input = document.getElementById('userInput').value;
            const errorEl = document.getElementById('inputError');
            let userPart = '';

            if (input.length > totalLength) {
                userPart = input.substring(0, totalLength);
                errorEl.textContent = `⚠️ Введено больше ${totalLength} символов. Использованы первые ${totalLength}.`;
            } else {
                userPart = input;
                errorEl.textContent = '';
            }

            let charsToGenerate = totalLength - userPart.length;
            let generatedPart = '';

            for (let i = 0; i < charsToGenerate; i++) {
                let choice = Math.floor(Math.random() * 2);
                if (choice === 0) {
                    generatedPart += digits[Math.floor(Math.random() * digits.length)];
                } else {
                    generatedPart += letters[Math.floor(Math.random() * letters.length)];
                }
            }

            const finalPassword = userPart + generatedPart;
            const passwordDisplay = document.getElementById('passwordDisplay');
            const copyBtn = document.getElementById('copyBtn');

            passwordDisplay.textContent = finalPassword;
            passwordDisplay.className = '';
            copyBtn.style.display = 'inline-block';
        }

        function copyPassword() {
            const text = document.getElementById('passwordDisplay').textContent;
            if (text && text !== 'Нажмите «Сгенерировать»') {
                navigator.clipboard.writeText(text).then(() => {
                    const btn = document.getElementById('copyBtn');
                    const originalText = btn.textContent;
                    btn.textContent = '✅';
                    setTimeout(() => {
                        btn.textContent = originalText;
                    }, 1500);
                }).catch(() => {
                    alert('Не удалось скопировать. Скопируйте вручную.');
                });
            }
        }

        window.onload = function() {
            generatePassword();
        };
    </script>
</body>
</html>
